apis:
- name: Ministry of Supply Agentic Commerce API (UCP / MCP)
  description: >-
    The store's Universal Commerce Protocol service, exposed over MCP at /api/ucp/mcp. An anonymous
    tools/list returns thirteen tools covering catalog search and lookup, product detail, cart create /
    read / update / cancel, checkout create / read / update / complete / cancel, and order lookup. Payment
    completion requires explicit buyer approval and an idempotency key.
  humanURL: https://www.ministryofsupply.com/agents.md
  baseURL: https://www.ministryofsupply.com/api/ucp/mcp
  tags:
