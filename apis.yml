aid: ministry-of-supply
name: Ministry of Supply
description: >-
  Ministry of Supply is a Boston-based performance apparel company founded in 2011 out of MIT, engineering
  technical dress shirts, pants, suits, knitwear and outerwear for work, travel and commuting using
  temperature-regulating, wrinkle-resistant and stretch-recovery fabrics. It sells direct to consumer from a
  Shopify storefront at ministryofsupply.com. Its API surface is not a developer program but an agentic
  commerce surface: the store publishes an agents.md / llms.txt instruction document, a Universal Commerce
  Protocol (UCP) merchant profile at /.well-known/ucp, and a live, anonymously-callable Model Context Protocol
  endpoint at /api/ucp/mcp exposing thirteen catalog, cart, checkout and order tools with full JSON Schema
  inputs, plus Shopify customer-account OpenID Connect discovery documents. Checkout requires contemporaneous
  human approval; complete_checkout requires an idempotency key.
