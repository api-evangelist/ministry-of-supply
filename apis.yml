- name: Ministry of Supply Storefront JSON
  description: >-
    Read-only, unauthenticated storefront JSON the store's own agents.md points agents at — /products.json,
    /collections.json, /products/{handle}.json, /collections/{handle}/products.json and /search. Shopify
    platform endpoints served from the merchant's own host and explicitly documented by the merchant for
    agent use.
  humanURL: https://www.ministryofsupply.com/agents.md
  baseURL: https://www.ministryofsupply.com
