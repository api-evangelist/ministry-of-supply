tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
- name: create_cart
  category: cart
  description: Creates a new cart.
- name: get_cart
  category: cart
  description: Get the cart contents.
- name: update_cart
  category: cart
  description: Perform updates to a cart.
- name: cancel_cart
  category: cart
  description: Cancels a cart.
- name: create_checkout
  category: checkout
  description: Creates a checkout. Returns checkout details, including line items, totals, discounts and
    taxes.
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, discounts and taxes.
- name: update_checkout
  category: checkout
  description: Updates a checkout.
- name: complete_checkout
  category: checkout
  description: Completes a checkout and returns the checkout result, including order ID and Thank You
    Page URL. Requires meta.idempotency-key. Buyer approval is required before payment.
  requires_idempotency_key: true
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
- name: get_order
  category: order
  description: Get the details of an order.
notes:
- Every tool requires meta.ucp-agent.profile — a URI identifying the calling agent's UCP profile.
- Only complete_checkout requires meta.idempotency-key.
- Identifiers are Shopify GIDs (gid://shopify/Checkout/..., gid://shopify/Cart/..., gid://shopify/Order/...).
- Prices are integers in ISO 4217 minor units paired with a currency code.
- No OpenAPI is published; the MCP inputSchema set in the saved tools/list IS the machine-readable contract.
